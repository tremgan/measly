[project]
name = "measly"
version = "0.1.0"
description = "Estimate whether a model is data-limited, and whether more capacity would pay off."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Remi Tregan", email = "tregan.remi@gmail.com" }]
keywords = ["learning-curve", "scaling-law", "sample-size", "active-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "rich>=15.0.0",
    "ruff>=0.16.10",
    "scipy>=1.17.1",
    "xarray>=2026.9.0",
]

[project.urls]
Homepage = "https://github.com/tremgan/measly"
Source = "https://github.com/tremgan/measly"
Issues = "https://github.com/tremgan/measly/issues"

[dependency-groups]
dev = ["pytest>=8"]
demo = ["matplotlib>=3.8", "scikit-learn>=1.4"]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measly"]
