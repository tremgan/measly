[project]
name = "measly"
version = "0.1.0"
description = "Estimate whether a model is data-limited, and whether more capacity would pay off."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measly"]
